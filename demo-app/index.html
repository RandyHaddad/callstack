<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FieldStack Demo Dashboard</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #111827;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #f9fafb;
      }
      .card {
        width: min(90vw, 420px);
        background: white;
        border: 1px solid #dbeafe;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 10px 20px rgba(2, 6, 23, 0.05);
      }
      .meta {
        display: grid;
        gap: 8px;
        margin: 18px 0;
        color: #334155;
      }
      .report-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid #e2e8f0;
        padding-top: 16px;
      }
      .export {
        padding: 12px;
        border: 0;
        border-radius: 10px;
        color: white;
        background: #2563eb;
        font-weight: 700;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Acme Reports</h1>
      <section class="meta">
        <span>Tenant: <strong id="tenant">acme-demo</strong></span>
        <span>Plan: <strong id="plan">enterprise</strong></span>
        <span>Report: Q2 implementation metrics</span>
      </section>
      <section class="report-row">
        <strong>CSV export</strong>
        <button id="exportBtn" class="export hidden">Export CSV</button>
      </section>
      <p style="margin-top: 16px; color: #334155">
        Buggy behavior: Acme is Enterprise, but export is only enabled for Pro.
      </p>
    </main>
    <script>
      const plan = document.querySelector("#plan").textContent.trim().toLowerCase();
      const exportButton = document.querySelector("#exportBtn");
      const canExport = ["pro", "enterprise"].includes(plan);

      if (canExport) {
        exportButton.classList.remove("hidden");
      }
    </script>
  </body>
</html>
